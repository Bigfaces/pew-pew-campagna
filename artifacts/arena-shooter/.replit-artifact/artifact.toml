kind = "web"
previewPath = "/"
title = "Arena Sniper"
version = "1.0.0"
id = "artifacts/arena-shooter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21103

[services.development]
run = "pnpm --filter @workspace/arena-shooter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arena-shooter", "run", "build" ]
serve = "static"
publicDir = "artifacts/arena-shooter/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21103"
BASE_PATH = "/"
